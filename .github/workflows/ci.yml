name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, and unit coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run quality
      - run: npm run test:unit
      - name: Install CodeScene coverage CLI
        if: github.event_name == 'push'
        shell: bash
        run: |
          install_dir="$RUNNER_TEMP/codescene"
          archive="$install_dir/cs-coverage.zip"
          key="$install_dir/codescene-cli-gpg-public.asc"
          keyring="$install_dir/gnupg"

          mkdir -p "$install_dir/target" "$keyring"
          chmod 700 "$keyring"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            https://downloads.codescene.io/enterprise/cli/cs-coverage-linux-amd64-latest.zip
          curl --fail --silent --show-error --location \
            --output "$key" \
            https://downloads.codescene.io/enterprise/keys/codescene-cli-gpg-public.asc

          fingerprint="$(gpg --batch --homedir "$keyring" --show-keys --with-colons "$key" | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$fingerprint" = "2E8DD144459EDC185E2591183C04140BD929767D"

          unzip -p "$archive" cs-coverage.sha256.asc > "$install_dir/cs-coverage.sha256.asc"
          unzip -p "$archive" cs-coverage > "$install_dir/target/cs-coverage"
          gpg --batch --homedir "$keyring" --import "$key"
          gpg --batch --homedir "$keyring" \
            --output "$install_dir/cs-coverage.sha256" \
            --decrypt "$install_dir/cs-coverage.sha256.asc"
          (cd "$install_dir" && sha256sum --check cs-coverage.sha256)

          chmod +x "$install_dir/target/cs-coverage"
          echo "$install_dir/target" >> "$GITHUB_PATH"
      - name: Upload coverage to CodeScene
        if: github.event_name == 'push'
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        run: |
          test -n "$CS_ACCESS_TOKEN" || (echo "Repository secret CS_ACCESS_TOKEN is required" && exit 1)
          cs-coverage upload --format lcov --metric line-coverage coverage/lcov.info
          cs-coverage upload --format lcov --metric branch-coverage coverage/lcov.info
          cs-coverage upload --format lcov --metric function-coverage coverage/lcov.info

  mutation:
    name: Mutation coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:mutation

  dependency-security:
    name: Dependency security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run security:audit
      - name: Run Snyk
        if: github.event_name == 'push'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          test -n "$SNYK_TOKEN" || (echo "Repository secret SNYK_TOKEN is required" && exit 1)
          npm run security:snyk
